# Builds omnivoice.cpp for NVIDIA CUDA on Windows and Linux.
#
# One artifact per OS per architecture, so each is small and you download only
# what you need. To add a GPU later, append to the `sm` matrix below; nothing
# else changes. Architectures map as: 75 = GTX 1650 / T4 (Turing),
# 80 = A100 (Ampere), 89 = L4 (Ada), 120a = Blackwell (needs CUDA >= 12.8).
#
# Design rationale, including why each non-obvious flag is set:
# docs/superpowers/specs/2026-09-29-omnivoice-cuda-build-design.md

name: Build (CUDA)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cuda-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} (sm${{ matrix.sm.name }}, cuda${{ matrix.cuda }})

    # windows-2022, not windows-latest. Current windows-latest images also ship
    # Visual Studio 2026, and CMake selects the newest generator it finds, so an
    # implicit generator picks "Visual Studio 18 2026" and configure then fails
    # with "No CUDA toolset found" at enable_language(CUDA): CUDA 12.8 ships an
    # MSBuild toolset for the VS 2022 v143 toolset only. Every project that
    # publishes Windows CUDA binaries pins windows-2022 for this reason
    # (llama.cpp, koboldcpp, node-llama-cpp); koboldcpp works around it by
    # renaming the VS 2022 directory so CMake cannot select it at all.
    runs-on: ${{ matrix.os == 'windows' && 'windows-2022' || 'ubuntu-24.04' }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows, linux]
        # One artifact per architecture, never a fat multi-arch binary: smaller
        # downloads, and each is native SASS for its target.
        #
        # `cuda` is the architecture as CMake wants it and `name` is what appears
        # in the artifact filename, because Blackwell needs the 'a' suffix -
        # 120a, not 120. ggml's own default list uses 120a-real for the same
        # reason, and CUDA 12.8 is the first toolkit that can emit it.
        #
        #   75   Turing       GTX 1650, Tesla T4 (Colab + Kaggle)
        #   80   Ampere       A100
        #   89   Ada Lovelace L4
        #   120a Blackwell    RTX PRO 6000 (Colab G4)
        #
        # fail-fast: false is load-bearing here: if one architecture turns out
        # to be wrong for a given toolkit, only that job fails and the other
        # three still produce artifacts.
        sm:
          - { cuda: '75',   name: '75' }
          - { cuda: '80',   name: '80' }
          - { cuda: '89',   name: '89' }
          - { cuda: '120a', name: '120a' }
        # 12.x rather than 13.x: CUDA 13 removed offline compilation for
        # Maxwell/Pascal/Volta, and Kaggle and Colab both gate Tesla P100
        # (sm_60) instances on some tiers. 12.8 is also the first toolkit that
        # can emit sm_120, so adding Blackwell later needs no toolkit change.
        cuda: ['12.8.1']

    steps:
      # submodules: recursive is mandatory. Without it ggml/ is empty and
      # add_subdirectory(${GGML_SOURCE_DIR} ggml) in CMakeLists.txt fails
      # immediately. A plain `git clone` does not cover this either.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # Both operating systems install CUDA the same way. A container image
      # would be faster on Linux, but selecting one per-OS means a conditional
      # `container:` expression, and Windows runners reject containers
      # outright, so a mistake there fails both jobs before anything runs.
      # One shared mechanism is worth a couple of minutes of install time.
      #
      # method: network is required on Linux and works on Windows. It also
      # avoids the full 12.x Windows installer, which bundles a display driver
      # we do not want installed on a GPU-less runner. The action caches the
      # downloaded installer itself.
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          method: network
          log-file-suffix: '${{ matrix.os }}.txt'

      - name: Install build tools (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          # sudo is required: without a container the job runs as the
          # non-root 'runner' user, and apt cannot take its own lock.
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build build-essential git

      # CMAKE_CUDA_ARCHITECTURES is pinned deliberately and must not be dropped.
      # The ggml default list starts 50-virtual 61-virtual 70-virtual, which a
      # 13.x toolkit cannot compile at all. Pinning also keeps the default list
      # from ever being evaluated, and '75-real' emits native SASS for the
      # target instead of paying a PTX JIT on every process start.
      # GGML_BACKEND_DL=ON makes the CUDA backend a separate ggml-cuda.dll
      # loaded at runtime by ggml_backend_load_all(), so it must ship next to
      # the executables.
      #
      # GGML_CUDA_FORCE_MMQ is applied only to sm_75. ggml detects missing tensor
      # cores at startup and falls back on its own, so on Turing the flag just
      # makes that explicit; on Ampere and newer it would actively hurt, since
      # MMQ replaces cuBLAS tensor-core GEMMs with integer dot products. It is
      # therefore set conditionally in the Configure steps, not globally.
      #
      # The generator is pinned to Visual Studio 2022 and must not be dropped.
      # Current runner images also carry Visual Studio 2026, and CMake picks the
      # newest it finds, so leaving the generator implicit selects "Visual Studio
      # 18 2026" and configure then dies with "No CUDA toolset found" at
      # enable_language(CUDA). CUDA 12.8 ships a toolset for the VS 2022 (v143)
      # toolset only. llama.cpp pins windows-2022 for the same reason.
      - name: Configure (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # MMQ is for GPUs with no tensor cores. Turing (sm_75) is the only
          # architecture here that qualifies - the GTX 1650 and the T4. Ampere,
          # Ada and Blackwell all have tensor cores, where forcing MMQ would
          # replace cuBLAS tensor-core GEMMs with slower integer dot products.
          #
          # Built as an array and splatted with @mmq, not a bare $mmq. An empty
          # PowerShell string still passes an empty argument to a native command
          # and CMake rejects it with 'Unknown argument ""'. An empty array
          # splats to nothing.
          $mmq = if ('${{ matrix.sm.cuda }}' -eq '75') { @('-DGGML_CUDA_FORCE_MMQ=ON') } else { @() }
          cmake -S . -B build-msvc `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DGGML_CUDA=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_CUDA_CUB_3DOT2=ON `
            -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.sm.cuda }}-real `
            @mmq `
            --log-level=ERROR

      - name: Configure (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          # Same reasoning as the Windows step: MMQ only where there are no
          # tensor cores.
          mmq=""
          [ "${{ matrix.sm.cuda }}" = "75" ] && mmq="-DGGML_CUDA_FORCE_MMQ=ON"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DGGML_BACKEND_DL=ON \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA_CUB_3DOT2=ON \
            -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.sm.cuda }}-real \
            $mmq

      # /v:minimal and ErrorsOnly keep the MSBuild log readable; without them a
      # CUDA build emits tens of thousands of per-file progress lines.
      - name: Build (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          cmake --build build-msvc --config Release -j $env:NUMBER_OF_PROCESSORS `
            -- /v:minimal /consoleloggerparameters:ErrorsOnly

      - name: Build (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          cmake --build build -j "$(nproc)"

      # No GPU on the runners, so this only proves the binaries start. Real
      # synthesis has to be checked on a machine with a GPU.
      - name: Smoke test
        continue-on-error: true
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then B=build-msvc/Release; else B=build; fi
          for tool in omnivoice-tts omnivoice-codec tts-server quantize; do
            echo "--- $tool ---"
            "$B/$tool" --help 2>&1 | head -3 || echo "  (no output)"
          done

      # An NVIDIA driver provides nvcuda.dll but NOT cublas or cudart: those ship
      # only with the toolkit, and ggml cannot statically link cuBLAS on Windows
      # (no static cuBLAS library exists there after toolkit 12.3.1). Without
      # these the executables die at load time with 0xC0000135
      # STATUS_DLL_NOT_FOUND, which users see as "exit code -1073741515".
      #
      # A missing DLL fails the build rather than warning. A silently broken CUDA
      # zip that looks fine until a user runs it is worse than a red build.
      #
      # The globs are version-agnostic and also probe bin\x64, so a future CUDA
      # bump (cublas64_12 -> cublas64_13, and CUDA 13 relocating DLLs into
      # bin\x64) cannot silently reintroduce the same breakage.
      - name: Package (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item "build-msvc\Release\*.exe" dist\ -ErrorAction SilentlyContinue
          Copy-Item "build-msvc\Release\*.dll" dist\ -ErrorAction SilentlyContinue

          $missing = @()
          foreach ($lib in @('cudart64_*', 'cublas64_*', 'cublasLt64_*')) {
            $found = Get-ChildItem -Path "$env:CUDA_PATH\bin\$lib.dll", "$env:CUDA_PATH\bin\x64\$lib.dll" `
                     -ErrorAction SilentlyContinue
            if ($found) {
              Copy-Item $found.FullName dist\
              Write-Output "bundled $($found.Name -join ', ')"
            } else {
              $missing += $lib
            }
          }
          if ($missing.Count -gt 0) {
            throw "CUDA runtime DLLs not found under $env:CUDA_PATH (missing: $($missing -join ', ')). Refusing to publish a CUDA zip that cannot load."
          }

          # MSVC runtime, so the build also runs on a clean Windows install
          # rather than depending on a redist some earlier app happened to leave.
          # Roughly 0.8 MB.
          #
          # The layout is ...\Microsoft Visual Studio\<year>\<edition>\VC\Redist\
          # MSVC\<ver>\x64\Microsoft.VC<nnn>.CRT\, so the glob needs TWO path
          # segments between "Visual Studio" and "\VC\" - one '*' silently
          # matched nothing on the first run and the artifact shipped without
          # these DLLs. Glob the DLLs directly and throw if none are found.
          $crt = Get-ChildItem -Path "$env:ProgramFiles\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\*.dll" `
                 -File -ErrorAction SilentlyContinue
          if ($crt) {
            Copy-Item $crt.FullName dist\
            Write-Output "bundled MSVC runtime: $($crt.Name -join ', ')"
          } else {
            throw "MSVC runtime DLLs not found under $env:ProgramFiles\Microsoft Visual Studio. Refusing to publish an artifact that may need the VC++ redistributable installed."
          }

          # The archive name is derived from matrix.os so it cannot drift out of
          # step with the upload pattern below. A hardcoded "win" here once
          # produced omnivoice-win-cuda-sm75.zip while the upload looked for
          # omnivoice-windows-cuda-sm75.*, and the whole Windows job was lost
          # after a 29-minute build.
          Compress-Archive -Path dist\* `
            -DestinationPath "omnivoice-${{ matrix.os }}-cuda-sm${{ matrix.sm.name }}.zip" -Force

          # Echo the staged files so the manifest is verifiable from the log even
          # if a later step fails.
          Write-Output "--- dist contents ---"
          Get-ChildItem dist | ForEach-Object {
            "{0,-28} {1,10:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      # Colab and Kaggle images already provide the CUDA runtime, so bundling
      # several hundred MB of it here would be pure waste.
      - name: Package (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          mkdir -p dist
          cp build/omnivoice-tts build/omnivoice-codec build/tts-server build/quantize dist/
          cp build/*.so dist/ 2>/dev/null || true
          tar -C dist -czf "omnivoice-${{ matrix.os }}-cuda-sm${{ matrix.sm.name }}.tar.gz" .
          echo "--- dist contents ---"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: omnivoice-${{ matrix.os }}-cuda-sm${{ matrix.sm.name }}
          path: omnivoice-${{ matrix.os }}-cuda-sm${{ matrix.sm.name }}.*
          if-no-files-found: error
          # Already-compressed payload; compressing again wastes minutes.
          compression-level: 0
          retention-days: 14
